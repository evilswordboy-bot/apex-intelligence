<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="apexGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2D6BFF"/>
      <stop offset="50%" stop-color="#12E2A3"/>
      <stop offset="100%" stop-color="#B6FF3B"/>
    </linearGradient>
    <filter id="apexGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Shield Base with rounded corners -->
  <rect width="48" height="48" rx="12" fill="#070B16"/>
  <rect width="48" height="48" rx="12" stroke="#1C2745" stroke-width="1.5"/>

  <!-- Minimal APEX Chevron Peak: Upward trajectory + Peak + Velocity Vector -->
  <g filter="url(#apexGlow)">
    <!-- Main Upward Apex Peak -->
    <path d="M24 8L37 36H28.5L24 25.5L19.5 36H11L24 8Z" fill="url(#apexGradient)"/>
    <!-- Velocity Split Notch (Kinetic Impulse) -->
    <polygon points="24,19 28.5,30 25.5,30 24,26.5 22.5,30 19.5,30" fill="#070B16"/>
  </g>
</svg>
